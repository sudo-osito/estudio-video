<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121016">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Estudio">
  <title>Estudio</title>
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- Entrada: la llave se pega una vez y queda en este equipo -->
  <section id="entrada" class="entrada" hidden>
    <div class="entrada-caja">
      <div class="marca"><span class="rec"></span>Estudio</div>
      <h1>Tu calendario de grabación</h1>
      <p>Pega la llave que te dio Claude. Queda guardada solo en este equipo.</p>
      <form id="form-llave">
        <input id="campo-llave" type="password" autocomplete="off" placeholder="es_…" required>
        <button class="boton primario" type="submit">Entrar</button>
      </form>
      <p class="error" id="error-llave" hidden></p>
    </div>
  </section>

  <main id="app" hidden>
    <header class="barra">
      <div class="marca"><span class="rec"></span>Estudio</div>
      <div class="barra-der">
        <span class="sello-racha" id="racha" hidden></span>
        <div class="vista-selector" role="tablist" aria-label="Vista">
          <button role="tab" data-vista="lista" aria-selected="true">Lista</button>
          <button role="tab" data-vista="mes" aria-selected="false">Mes</button>
        </div>
      </div>
    </header>

    <div class="lienzo">
      <div class="columna">
        <section id="hoy" aria-label="Lo que toca grabar"></section>
        <nav id="semana" class="semana" aria-label="Esta semana"></nav>
        <section id="listado" aria-label="Calendario"></section>
      </div>
      <aside id="detalle" class="detalle" aria-label="Detalle del video" hidden></aside>
    </div>
  </main>

  <div id="prompter" class="prompter" hidden>
    <div class="prompter-texto" id="prompter-texto"></div>
    <div class="prompter-mandos">
      <button class="boton" data-p="cerrar">Cerrar</button>
      <label class="velocidad">Velocidad <input type="range" min="10" max="120" value="42" id="prompter-vel"></label>
      <button class="boton" data-p="espejo">Espejo</button>
      <button class="boton primario" data-p="play">Partir</button>
    </div>
  </div>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
