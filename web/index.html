<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3f1">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Heika">
  <title>Heika</title>
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono-180.png">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&display=swap">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- El éter: manchas lentas con los colores de la marca, detrás del vidrio -->
  <div class="eter" aria-hidden="true"><i class="e1"></i><i class="e2"></i><i class="e3"></i><i class="e4"></i></div>

  <!-- Cargando: la H respira y la barra corre como una línea de tiempo -->
  <div id="cargando" class="cargando" aria-label="Cargando">
    <div class="cargando-marca" data-logo="simbolo"></div>
    <i class="cargando-barra"></i>
  </div>

  <!-- Entrada: la llave se pega una vez y queda en este equipo -->
  <section id="entrada" class="entrada" hidden>
    <div class="entrada-caja vidrio">
      <div class="entrada-logo" data-logo="completo"></div>
      <i class="entrada-barra"></i>
      <h1>Bienvenido a Heika</h1>
      <p>Pega tu llave de acceso. Queda guardada solo en este equipo.</p>
      <form id="form-llave">
        <input id="campo-llave" type="password" autocomplete="off" placeholder="es_…" required>
        <button class="boton primario ancho" type="submit">Continuar</button>
      </form>
      <p class="error" id="error-llave" hidden></p>
    </div>
  </section>

  <div id="app" class="app" hidden>
    <aside class="lateral vidrio" id="lateral" aria-label="Navegación">
      <div class="lat-cabeza">
        <button class="lat-logo" data-ir-hoy aria-label="Heika · volver a hoy" data-logo="completo"></button>
        <button class="icono-boton lat-plegar" data-plegar aria-label="Plegar la barra lateral" title="Plegar ( [ )">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="15" height="13" rx="3"/><path d="M7.5 3.5v13"/><path class="flecha-plegar" d="M13 8l-2 2 2 2"/></svg>
        </button>
      </div>

      <nav class="lat-nav" id="lat-nav">
        <i class="lat-indicador" aria-hidden="true"></i>
        <button class="lat-item" data-vista="mes" style="--n:0">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="13" rx="3"/><path d="M3 8.5h14M7 2.5v3M13 2.5v3"/></svg>
          <span>Calendario</span>
        </button>
        <button class="lat-item" data-vista="agenda" style="--n:1">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 5.5h9M8 10h9M8 14.5h9"/><circle cx="4" cy="5.5" r="1" fill="currentColor"/><circle cx="4" cy="10" r="1" fill="currentColor"/><circle cx="4" cy="14.5" r="1" fill="currentColor"/></svg>
          <span>Agenda</span>
        </button>
        <a class="lat-item" href="guion/" style="--n:2">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="15" height="12" rx="3"/><path d="M8.5 7.6v4.8l4-2.4z" fill="currentColor"/></svg>
          <span>Guion visual</span>
        </a>
      </nav>

      <div class="lat-bloque" style="--n:3">
        <p class="lat-titulo">Próximos</p>
        <div class="lat-proximos" id="lat-proximos"></div>
      </div>

      <div class="lat-progreso" id="lat-progreso" style="--n:4">
        <svg class="anillo" viewBox="0 0 44 44" aria-hidden="true"><circle class="anillo-pista" cx="22" cy="22" r="18"/><circle class="anillo-valor" cx="22" cy="22" r="18" pathLength="100"/></svg>
        <div class="lat-progreso-texto"><b id="prog-num">0</b><span id="prog-texto">grabados</span></div>
        <i class="barra-marca" aria-hidden="true"><b id="prog-barra"></b></i>
      </div>

      <div class="lat-pie" style="--n:5">
        <button class="lat-item" data-salir>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="10" r="3.5"/><path d="M10.5 10H18M15 10v3M17.5 10v2"/></svg>
          <span>Cambiar llave</span>
        </button>
      </div>
    </aside>
    <div class="velo-lateral" data-cerrar-lateral></div>

    <div class="principal">
      <header class="barra" id="barra">
        <button class="icono-boton solo-movil" data-abrir-lateral aria-label="Abrir menú">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 7h13M3.5 13h9"/></svg>
        </button>
        <div class="titulo-vista">
          <h1 id="titulo-mes"></h1>
          <span id="titulo-sub"></span>
        </div>
        <button class="volver-hoy vidrio" data-mes="hoy" id="volver-hoy" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5L4 9l4 4"/><path d="M4 9h8a4 4 0 010 8h-1"/></svg><span class="solo-esc">Volver a hoy</span><span class="solo-cel">Hoy</span></button>
        <div class="nav-mes vidrio" id="nav-mes">
          <button class="icono-boton" data-mes="-1" aria-label="Mes anterior"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 15l-5-5 5-5"/></svg></button>
          <i class="nav-sep" aria-hidden="true"></i>
          <button class="icono-boton" data-mes="1" aria-label="Mes siguiente"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 5l5 5-5 5"/></svg></button>
        </div>
      </header>

      <main class="lienzo">
        <section id="hoy" aria-label="Lo que toca grabar"></section>
        <section id="vista" aria-label="Calendario"></section>
      </main>
    </div>

    <!-- Celular: barra de pestañas flotante -->
    <nav class="pestanas-movil vidrio" id="pestanas-movil" aria-label="Vista">
      <i class="pm-indicador" aria-hidden="true"></i>
      <button data-vista="mes"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="13" rx="3"/><path d="M3 8.5h14M7 2.5v3M13 2.5v3"/></svg>Mes</button>
      <button data-vista="agenda"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 5.5h9M8 10h9M8 14.5h9"/><circle cx="4" cy="5.5" r="1" fill="currentColor"/><circle cx="4" cy="10" r="1" fill="currentColor"/><circle cx="4" cy="14.5" r="1" fill="currentColor"/></svg>Agenda</button>
      <a href="guion/"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="15" height="12" rx="3"/><path d="M8.5 7.6v4.8l4-2.4z" fill="currentColor"/></svg>Guion</a>
    </nav>
  </div>

  <div id="velo" class="velo" hidden></div>
  <aside id="detalle" class="cajon" aria-label="Detalle del video" hidden></aside>

  <!-- Teleprompter: un párrafo a la vez, cada uno con su tiempo (como el estudio de voz) -->
  <div id="prompter" class="prompter" hidden>
    <header class="pr-arriba">
      <button class="pr-volver" data-p="cerrar"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 15l-5-5 5-5"/></svg>Volver</button>
      <div class="pr-centro">
        <span class="pr-reloj" id="pr-reloj"></span>
        <span class="pr-oido" id="pr-oido" hidden><i class="pr-nivel" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></i><span id="pr-oido-texto"></span></span>
      </div>
      <button class="pr-icono" data-p="espejo" aria-label="Espejo" title="Espejo (para teleprompter con vidrio)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v14M7 6L3 10l4 4M13 6l4 4-4 4"/></svg></button>
    </header>
    <div class="pr-toma" id="pr-toma" role="status"></div>
    <div class="pr-escenario" id="pr-escenario">
      <div class="pr-lista" id="pr-lista"></div>
      <div class="pr-cuenta" id="pr-cuenta" hidden></div>
    </div>
    <footer class="pr-abajo">
      <div class="pr-controles">
        <button class="pr-icono grande" data-p="anterior" aria-label="Párrafo anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5.5v13L9.5 12z"/></svg></button>
        <button class="pr-play" data-p="play" aria-label="Partir"><svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6L19 12z"/></svg><svg class="i-pausa" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
        <button class="pr-icono grande" data-p="siguiente" aria-label="Párrafo siguiente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5.5v13L14.5 12z"/></svg></button>
      </div>
      <div class="pr-ajustes">
        <div class="pr-segmento" id="pr-modo" role="group" aria-label="Cómo avanza" hidden>
          <button data-modo="voz"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3 7.5a5 5 0 0010 0M8 12.5v2"/></svg>Sigue tu voz</button><button data-modo="tiempo">Por tiempo</button>
        </div>
        <div class="pr-segmento" id="pr-filtro" role="group" aria-label="Qué párrafos">
          <button data-filtro="camara">A cámara</button><button data-filtro="voz">Voz en off</button>
        </div>
        <div class="pr-segmento solo-tiempo" role="group" aria-label="Ritmo">
          <button data-ritmo="lento">Lento</button><button data-ritmo="normal">Normal</button><button data-ritmo="rapido">Rápido</button>
        </div>
        <label class="pr-auto solo-tiempo"><input type="checkbox" id="pr-auto"><span>Avance automático</span></label>
      </div>
    </footer>
  </div>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
