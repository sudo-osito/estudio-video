<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Estudio">
  <title>Estudio</title>
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono-180.png">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- Entrada: la llave se pega una vez y queda en este equipo -->
  <section id="entrada" class="entrada" hidden>
    <div class="entrada-caja">
      <span class="logo grande" aria-hidden="true"></span>
      <h1>Bienvenido a Estudio</h1>
      <p>Pega tu llave de acceso. Queda guardada solo en este equipo.</p>
      <form id="form-llave">
        <input id="campo-llave" type="password" autocomplete="off" placeholder="es_…" required>
        <button class="boton primario ancho" type="submit">Continuar</button>
      </form>
      <p class="error" id="error-llave" hidden></p>
    </div>
  </section>

  <div id="app" hidden>
    <header class="barra">
      <div class="marca"><span class="logo" aria-hidden="true"></span>Estudio</div>
      <div class="nav-mes">
        <button class="icono-boton" data-mes="-1" aria-label="Mes anterior"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 15l-5-5 5-5"/></svg></button>
        <h1 id="titulo-mes"></h1>
        <button class="icono-boton" data-mes="1" aria-label="Mes siguiente"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 5l5 5-5 5"/></svg></button>
        <button class="boton chico" data-mes="hoy">Hoy</button>
      </div>
      <div class="barra-der">
        <span class="progreso" id="progreso"></span>
        <div class="segmento" role="tablist" aria-label="Vista">
          <button role="tab" data-vista="mes" aria-selected="true">Mes</button>
          <button role="tab" data-vista="agenda" aria-selected="false">Agenda</button>
        </div>
      </div>
    </header>

    <main class="lienzo">
      <section id="hoy" aria-label="Lo que toca grabar"></section>
      <section id="vista" aria-label="Calendario"></section>
    </main>
  </div>

  <div id="velo" class="velo" hidden></div>
  <aside id="detalle" class="cajon" aria-label="Detalle del video" hidden></aside>

  <div id="prompter" class="prompter" hidden>
    <div class="prompter-texto" id="prompter-texto"></div>
    <div class="prompter-mandos">
      <button class="boton oscuro" data-p="cerrar">Cerrar</button>
      <label class="velocidad">Velocidad <input type="range" min="10" max="120" value="42" id="prompter-vel"></label>
      <button class="boton oscuro" data-p="espejo">Espejo</button>
      <button class="boton blanco" data-p="play">Partir</button>
    </div>
  </div>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
